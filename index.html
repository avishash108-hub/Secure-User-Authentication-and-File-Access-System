
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Test Client</title>

  <style>
    body {
      font-family: monospace;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
    }

    fieldset {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 8px;
    }

    input, button, select {
      font-family: monospace;
      font-size: 14px;
      padding: 4px;
      margin-top: 2px;
    }

    button {
      cursor: pointer;
      margin-right: 6px;
      margin-top: 8px;
    }

    pre {
      background: #eee;
      padding: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    hr {
      margin: 25px 0;
    }
  </style>
</head>

<body>

<h1>Auth Test Client</h1>

<fieldset>
  <legend>Backend mode</legend>

  <label>
    <input type="radio" name="backendMode" value="custom" checked>
    Custom REST backend (Flask)
  </label>

  <label>
    <input type="radio" name="backendMode" value="appwrite" disabled>
    Appwrite (adapter not implemented yet)
  </label>
</fieldset>

<fieldset>
  <legend>Custom backend settings</legend>

  <label>
    Base URL
    <input
      id="baseUrl"
      value="https://osdag-login.onrender.com"
      size="40"
    >
  </label>

  <label>
    <input type="checkbox" id="useCookies">
    Backend uses cookie sessions
  </label>
</fieldset>

<fieldset>
  <legend>Appwrite settings (not currently active)</legend>

  <label>
    Endpoint
    <input id="awEndpoint" value="https://nyc.cloud.appwrite.io/v1" size="40">
  </label>

  <label>
    Project ID
    <input id="awProjectId" value="6a8a957c0004aebcd79d" size="30">
  </label>

  <label>
    Database ID
    <input id="awDatabaseId" value="6a8b2cc5001d47736dfb" size="30">
  </label>

  <label>
    Files table ID
    <input id="awFilesCollectionId" value="files" size="30">
  </label>

  <label>
    Storage bucket ID
    <input id="awBucketId" value="6a8b2ea70010dfac74ba" size="30">
  </label>
</fieldset>

<hr>

<fieldset>
  <legend>Register</legend>

  <label>
    Email
    <input id="regEmail" value="alice@example.com">
  </label>

  <label>
    Password
    <input id="regPassword" type="password" value="Password123!">
  </label>

  <button onclick="doRegister()">Register</button>
</fieldset>

<fieldset>
  <legend>Login</legend>

  <label>
    Email
    <input id="loginEmail" value="alice@example.com">
  </label>

  <label>
    Password
    <input id="loginPassword" type="password" value="Password123!">
  </label>

  <button onclick="doLogin()">Login</button>
  <button onclick="doLogout()">Logout</button>
</fieldset>

<fieldset>
  <legend>Session tokens</legend>

  <label>
    Access token
    <input id="token" size="60">
  </label>

  <p id="sessionStatus">Not logged in</p>
</fieldset>

<fieldset>
  <legend>Protected actions</legend>

  <button onclick="getMe()">GET /me</button>
  <button onclick="getFiles()">GET /files</button>

  <label>
    File ID
    <input id="fileId" value="1" size="10">
  </label>

  <button onclick="getFileById()">GET /files/:id</button>
  <button onclick="downloadFileById()">Download file</button>
</fieldset>

<h3>Response</h3>
<pre id="output">(responses will show up here)</pre>

<script>
  // The refresh token is kept separately from the access token.
  let refreshToken = '';

  function base() {
    return document.getElementById('baseUrl').value.trim().replace(/\/+$/, '');
  }

  function useCookies() {
    return document.getElementById('useCookies').checked;
  }

  function tokenVal() {
    return document.getElementById('token').value.trim();
  }

  function log(label, data) {
    document.getElementById('output').textContent =
      label + '\n\n' +
      (typeof data === 'string'
        ? data
        : JSON.stringify(data, null, 2));
  }

  function updateSessionStatus(message) {
    document.getElementById('sessionStatus').textContent = message;
  }

  function checkMode() {
    const mode = document.querySelector(
      'input[name="backendMode"]:checked'
    ).value;

    if (mode !== 'custom') {
      log('Mode unavailable', 'Only Custom REST backend mode is currently implemented.');
      return false;
    }

    return true;
  }

  // Common request handler for Flask API requests.
  async function request(path, options = {}, authToken = tokenVal()) {
    const headers = { ...(options.headers || {}) };

    if (!useCookies() && authToken) {
      headers['Authorization'] = 'Bearer ' + authToken;
    }

    if (useCookies()) {
      options.credentials = 'include';
    }

    try {
      const res = await fetch(base() + path, {
        ...options,
        headers
      });

      const contentType = res.headers.get('content-type') || '';
      let body;

      if (contentType.includes('application/json')) {
        body = await res.json();
      } else {
        body = await res.text();
      }

      return {
        status: res.status,
        ok: res.ok,
        body
      };

    } catch (error) {
      return {
        status: 0,
        ok: false,
        body: error.message
      };
    }
  }

  async function doRegister() {
    if (!checkMode()) return;

    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    const result = await request('/register', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    }, '');

    log('POST /register', result);
  }

  async function doLogin() {
    if (!checkMode()) return;

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const result = await request('/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    }, '');

    if (result.ok && result.body && typeof result.body === 'object') {
      if (result.body.access_token) {
        document.getElementById('token').value =
          result.body.access_token;
      }

      if (result.body.refresh_token) {
        refreshToken = result.body.refresh_token;
      }

      updateSessionStatus('Logged in');
    }

    log('POST /login', result);
  }

  async function doLogout() {
    if (!checkMode()) return;

    if (!refreshToken) {
      log('Logout', 'No refresh token available. Log in first.');
      return;
    }

    // Your Flask logout route expects the refresh token.
    const result = await request(
      '/logout',
      { method: 'POST' },
      refreshToken
    );

    if (result.ok) {
      document.getElementById('token').value = '';
      refreshToken = '';
      updateSessionStatus('Logged out');
    }

    log('POST /logout', result);
  }

  async function getMe() {
    if (!checkMode()) return;

    const result = await request('/me', {
      method: 'GET'
    });

    log('GET /me', result);
  }

  async function getFiles() {
    if (!checkMode()) return;

    const result = await request('/files', {
      method: 'GET'
    });

    log('GET /files', result);
  }

  // Your previously shown Flask route serves files at /files/<file_id>.
  async function getFileById() {
    await downloadFileById();
  }

  async function downloadFileById() {
    if (!checkMode()) return;

    const id = document.getElementById('fileId').value.trim();

    if (!id) {
      log('Download', 'Enter a file ID first.');
      return;
    }

    const headers = {};

    if (!useCookies() && tokenVal()) {
      headers['Authorization'] = 'Bearer ' + tokenVal();
    }

    try {
      const res = await fetch(base() + '/files/' + encodeURIComponent(id), {
        method: 'GET',
        headers,
        credentials: useCookies() ? 'include' : 'same-origin'
      });

      if (!res.ok) {
        const errorBody = await res.text();

        log('GET /files/' + id, {
          status: res.status,
          body: errorBody
        });

        return;
      }

      const contentType = res.headers.get('content-type') || '';

      // Display JSON responses instead of downloading them.
      if (contentType.includes('application/json')) {
        log('GET /files/' + id, {
          status: res.status,
          body: await res.json()
        });
        return;
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.href = url;
      a.download = 'file-' + id;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);

      log('GET /files/' + id, {
        status: res.status,
        note: 'File download triggered.'
      });

    } catch (error) {
      log('Download error', error.message);
    }
  }
</script>

</body>
</html>
